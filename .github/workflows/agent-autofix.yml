name: Agent Auto Fix

on:
  workflow_dispatch:
    inputs:
      instruction:
        description: '수정 지시 (예: 정규식 검사 추가)'
        required: true
        type: string

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Configure Git
        run: |
          git config user.name "sempre-agent"
          git config user.email "agent@withsempre.com"

      - name: Auto Fix
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tsx scripts/agents/runner.ts auto-fix --instruction="${{ github.event.inputs.instruction }}"
